# ═══════════════════════════════════════════════════════════
#  FarmHealth — Google App Engine (Flexible Environment)
#  Runs the Node.js server + static frontend 24x7 on GCP.
#  Deploy:  gcloud app deploy app.yaml
#  Note: uses the project Dockerfile (runtime: custom).
#  ═══════════════════════════════════════════════════════════

runtime: custom
env: flex

service: default

manual_scaling:
  instances: 1

resources:
  cpu: 1
  memory_gb: 1
  disk_size_gb: 10

# Health check uses the server's built-in endpoint
health_check:
  enable_health_check: True
  check_interval_sec: 30
  timeout_sec: 4
  unhealthy_threshold: 2
  healthy_threshold: 2

env_variables:
  NODE_ENV: production
  PORT: 8080
