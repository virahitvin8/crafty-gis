# ─── Netlify Configuration – Crafty GIS Satellite Crop Monitor ───

[build]
  command = "npm run build"
  publish = "."  # Change to "public" or "dist" if bash build.sh outputs to a subfolder

[dev]
  framework = "#static"

# SPA redirects: redirect API calls to crafty-gis backend (legacy name farmhealth1-backend)
[[redirects]]
  from = "/api/*"
  to = "https://farmhealth1-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & PWA Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self)"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
