# ─── Netlify Configuration – FarmHealth Satellite Crop Monitor ───
# Deploy the static frontend to Netlify
# The backend runs separately on Render or Google Cloud Run

[build]
  # Publish the built web assets
  publish = "www"
  # No build command needed - we pre-build with build.sh

[dev]
  framework = "#static"

# SPA redirects: serve index.html for all routes (so the app handles routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

# Proxy API calls to backend (update with your actual backend URL)
[[redirects]]
  from = "/api/*"
  to = "https://farmhealth-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Headers for security and PWA support
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self)"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
