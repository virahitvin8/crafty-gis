<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c8ee7"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <!-- Globe -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="white" stroke-width="8"/>
    <ellipse cx="0" cy="0" rx="140" ry="60" fill="none" stroke="white" stroke-width="6"/>
    <line x1="-140" y1="0" x2="140" y2="0" stroke="white" stroke-width="4"/>
    <line x1="0" y1="-140" x2="0" y2="140" stroke="white" stroke-width="4"/>
    <!-- Satellite -->
    <rect x="-20" y="-180" width="40" height="24" rx="4" fill="white"/>
    <rect x="-60" y="-176" width="36" height="16" rx="2" fill="white" opacity="0.8"/>
    <rect x="24" y="-176" width="36" height="16" rx="2" fill="white" opacity="0.8"/>
    <!-- Signal waves -->
    <path d="M -30 -140 Q 0 -100 30 -140" fill="none" stroke="white" stroke-width="4" opacity="0.6"/>
    <path d="M -50 -120 Q 0 -60 50 -120" fill="none" stroke="white" stroke-width="4" opacity="0.4"/>
    <!-- Leaf -->
    <path d="M -20 40 Q 0 0 20 40 Q 0 60 -20 40" fill="white" opacity="0.9"/>
    <line x1="0" y1="20" x2="0" y2="50" stroke="white" stroke-width="3"/>
  </g>
</svg>
