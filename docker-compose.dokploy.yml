# ═══════════════════════════════════════════════════════════
# Crafty GIS — Dokploy stack
#
#   In Dokploy:
#     Projects → crafty_gis → Add Resource → Docker Compose
#     → point at this file in the repo (or paste its contents).
#
#   This stack builds Crafty GIS from THIS repo's Dockerfile
#   (no external registry image required), then adds the
#   self-hosted companions:
#
#     crafty_gis    :8080   app + backend (public entrypoint)
#     ollama        :11434  self-hosted LLM + vision (internal)
#     postgis       :5432   saved farms / land records / STAC index
#     uptime-kuma   :3002   monitoring + alerts (optional)
#
#   SECRETS: do NOT mount ./.env. Instead, add each variable in
#   Dokploy → your service → Environment (paste the GEE private
#   key as ONE line with its \n escapes — Dokploy passes it
#   verbatim into the container, unlike a .env file).
#
#   Requires: 8 GB+ RAM. Model defaults can be lowered for small
#   boxes (OLLAMA_MODEL=deepseek-r1:1.5b, OLLAMA_VISION_MODEL=llava).
# ═══════════════════════════════════════════════════════════

services:
  # ─── Crafty GIS app + backend (public entrypoint on 8080) ───
  crafty_gis:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      # ── Open-source PRIMARYs ──
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-deepseek-r1:7b}
      - OLLAMA_VISION_MODEL=${OLLAMA_VISION_MODEL:-llava-phi3}
      # ── Google Earth Engine (free satellite source) ──
      - GEE_SERVICE_ACCOUNT=${GEE_SERVICE_ACCOUNT:-}
      - GEE_PRIVATE_KEY=${GEE_PRIVATE_KEY:-}
      # ── Cloud FALLBACKS (kept working) ──
      - SENTINEL_HUB_CLIENT_ID=${SENTINEL_HUB_CLIENT_ID:-}
      - SENTINEL_HUB_CLIENT_SECRET=${SENTINEL_HUB_CLIENT_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      ollama:
        condition: service_healthy
      postgis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Ollama — self-hosted LLM + vision (PRIMARY AI) ───
  ollama:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=10m
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Pull the configured models on first boot (kept running via `wait`)
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull ${OLLAMA_MODEL:-deepseek-r1:7b} || true && ollama pull ${OLLAMA_VISION_MODEL:-llava-phi3} || true && wait"]

  # ─── PostgreSQL + PostGIS — saved farms, land records, STAC/ODC index ───
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-crafty_gis}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-crafty_gis}
      - POSTGRES_DB=${POSTGRES_DB:-crafty_gis}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crafty_gis} -d ${POSTGRES_DB:-crafty_gis}"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Uptime Kuma — health monitoring + alerts (optional) ───
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    ports:
      - "3002:3001"
    volumes:
      - uptime_kuma_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ollama_models:
  postgis_data:
  uptime_kuma_data:
