# ═══════════════════════════════════════════════════════════
# FarmHealth — SELF-HOSTED stack (for the always-on laptop)
#
#   Deploy:
#     docker compose -f docker-compose.selfhost.yml up -d --build
#
#   This stack is Coolify/Dokploy friendly: every service is a
#   plain container with named volumes and healthchecks, so you
#   can copy these services into Coolify later (or run as-is).
#
#   Ports:
#     8080  → FarmHealth app + backend
#     3001  → Uptime Kuma dashboard
#     11434 → Ollama (LAN only — do NOT expose publicly, it has no auth)
#     5432  → PostgreSQL + PostGIS (LAN only)
#
#   See SELFHOST_MIGRATION.md for the full phased roadmap.
# ═══════════════════════════════════════════════════════════

services:
  # ─── FarmHealth app + backend ───
  farmhealth:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      # Self-hosted LLM (Ollama) — PRIMARY AI backend
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-deepseek-r1:7b}
      # Optional cloud fallback between Ollama and the built-in expert model
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Optional: real satellite credentials (see js/config.js)
      - SENTINEL_HUB_CLIENT_ID=${SENTINEL_HUB_CLIENT_ID:-}
      - SENTINEL_HUB_CLIENT_SECRET=${SENTINEL_HUB_CLIENT_SECRET:-}
      # Optional: Google Earth Engine service account
      - GEE_SERVICE_ACCOUNT=${GEE_SERVICE_ACCOUNT:-}
      - GEE_PRIVATE_KEY=${GEE_PRIVATE_KEY:-}
    volumes:
      - ./.env:/app/.env:ro
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ─── Ollama — self-hosted LLM (DeepSeek-R1-Distill-Qwen-7B) ───
  # 8GB RAM budget: keep OLLAMA_NUM_PARALLEL=1. If the box gets tight,
  # set OLLAMA_MODEL=qwen2.5:3b (≈2GB) or deepseek-r1:1.5b (≈1.1GB).
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=10m
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Pull the model on first boot so the app finds it ready.
    # (The entrypoint workaround keeps the server running after pulling.)
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull ${OLLAMA_MODEL:-deepseek-r1:7b} || true && wait"]

  # ─── PostgreSQL + PostGIS ───
  # Used now for saved farms / land records (Phase 4+), and later as the
  # index database for STAC + Open Data Cube (Phase 5). On 8GB RAM tune
  # shared_buffers low — postgis image defaults are fine for light use.
  postgis:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-farmhealth}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-farmhealth}
      - POSTGRES_DB=${POSTGRES_DB:-farmhealth}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgis_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farmhealth} -d ${POSTGRES_DB:-farmhealth}"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Uptime Kuma — self-hosted monitoring + alerts ───
  # Open http://<laptop-ip>:3001 → add monitors:
  #   • http://<laptop-ip>:8080/api/ai/health   (backend + Ollama probe)
  #   • http://<laptop-ip>:8080/api/gee/health  (satellite backend probe)
  #   • ping to <laptop-ip>                     (box alive, lid closed)
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

# ─── Persistent data ───
volumes:
  ollama_models:      # ~5GB for deepseek-r1:7b — back this up / move to USB if disk is small
  postgis_data:       # farm records, saved farms, later STAC/ODC index
  uptime_kuma_data:   # monitors, status pages, alert config
